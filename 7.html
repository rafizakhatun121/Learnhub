<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance course Registration form</title>
</head>
<body>
    <header>
        <h1>Registration Form</h1>
    </header>
    <main>
        <form action="/register" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter name">
                <label for="email">      Email</label>
                <input type="email" id="email" name="email" required><br>
                <label for="number">Phone number</label>
                <input type="tel" id="number" name="number" placeholder="0160000000">
                <label for="birthDate">Date of Birth</label>
                <input type="date" id="birthDate" name="birthDate"><br>
                <label for="num">Age</label>
                <input type="number" id="num" name="num">
                <p>profile Picture:</p>
                <label for="profile-picture">Profile picture</label>
                <input
                       type="file"
                      id="profile-picture"
                       name="profilePicture"
                     accept="image/*"
>
            </fieldset>
            <fieldset>
                <legend>Account Information</legend>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="muzahid_07"><br>
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" minlength="8" required><br>
                <label for="conframpass">Confrim Password</label>
                <input type="password" id="conframpass" name="conframpass" minlength="8" required>
            </fieldset>
            <fieldset>
                <legend>Course Selection</legend>
                <label for="course">Course</label>
                <select name="course" id="course">
                <option value=" ">Select Course</option>    
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                </select>
                
                <p>Learning Mode:</p>
                <input type="radio" id="online" name="learning" value="online">
                <label for="online">Online</label>
                <input type="radio" id="offline" name="learning" value="offline">
                <label for="offline">Offline</label>

                <p>Shift:</p>
                <input type="radio" id="morning" name="shift" value="morning">
                <label for="morning">Morning</label>
                <input type="radio" id="afternoon" name="shift" value="afternoon">
                <label for="afternoon">Afternoon</label>
                <input type="radio" id="evening" name="shift" value="evening">
                <label for="evening">Evening</label>
                
                <p>learning days:</p>
                <input type="checkbox" id="saturday" name="day" value="saturday">
                <label for="saturday">saturday</label>
                <input type="checkbox" id="sunday" name="day" value="sunday">
                <label for="sunday">Sunday</label>
                <input type="checkbox" id="monday" name="day" value="monday">
                <label for="monday">Monday</label>
                <input type="checkbox" id="tuesday" name="day" value="tuesday">
                <label for="tuesday">Tuesdayday</label>
                <input type="checkbox" id="wednesday" name="day" value="wednesday">
                <label for="wednesday">Wednesday</label>
                <input type="checkbox" id="thrusday" name="day" value="thrusday">
                <label for="thrusday">Thrusday</label>

                <label for="experience">Experience Level</label>
                <input type="range" id="experience" name="experience" min="0" max="10" value="5">
                
            </fieldset>
            <fieldset>
                <legend>Additional Information</legend>
                <label for="education-level">Current Education Level</label>

<select id="education-level" name="educationLevel">
    <option value="">Select education level</option>
    <option value="school">School</option>
    <option value="college">College</option>
    <option value="undergraduate">Undergraduate</option>
    <option value="graduate">Graduate</option>
</select>

                <label for="Portfolio">Portfolio URL</label>
                <input type="url" id="Portfolio" name="Portfolio">

                <label for="msg">About me</label>
                <textarea name="msg" id="msg" rows="5" placeholder="Hi,I am a cse student..."></textarea>

                <label for="massage">I can learn this course becouse:</label>
                <textarea name="massage" id="massage" rows="4" placeholder="I hope i am a web developer"></textarea>
                 <p>Term and condition</p>
               <input
    type="checkbox"
    id="terms"
    name="terms"
    value="accepted"
    required
>

<label for="terms">
    I agree to the terms and conditions
</label>
            </fieldset>
            <button type="submit">Register now</button>
            <button type="reset">Clear form</button>
        </form>

    </main>
    <footer>

    </footer>
</body>
</html>
